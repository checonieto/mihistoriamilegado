<style>
:root{--n:#121a2b;--l:#f0b35a;--p:#f3ead9;--k:#2a2118;--r:#b4475a;--m:#a9b3c6}

@media(prefers-reduced-motion){*{animation:none!important;transition:none!important}}

 of the first memories you have of your childhood?","c":"Infancia y hogar"},{"id":12,"es":"¿Cómo era la casa en la que creciste? ¿Qué tenía de especial?","en":"What was the house you grew up in like? What was special about it?","c":"Infancia y hogar"},{"id":13,"es":"¿Cómo eran las comidas familiares en tu casa?","en":"What were family meals like in your home?","c":"Infancia y hogar"},{"id":14,"es":"¿Qué juegos, juguetes o actividades te gustaban más cuando eras niño(a)?","en":"What games, toys, or activities did you like most as a child?","c":"Infancia y hogar"},{"id":15,"es":"¿Había un lugar secreto, rincón especial o escondite favorito donde jugabas?","en":"Was there a secret place, special corner, or favorite hiding spot where you played?","c":"Infancia y hogar"},{"id":16,"es":"¿Quién fue tu mejor amigo(a) en la infancia y qué hacían juntos?","en":"Who was your best friend in childhood and what did you do together?","c":"Infancia y hogar"},{"id":17,"es":"¿Dónde estudiaste la primaria y cómo fue tu primer día de clases?","en":"Where did you attend elementary school and what was your first day of class like?","c":"Escuela y adolescencia"},{"id":18,"es":"¿Tuviste un maestro o maestra que marcó tu vida? ¿Por qué?","en":"Did you have a teacher who made a mark on your life? Why?","c":"Escuela y adolescencia"},{"id":19,"es":"¿Qué materias o actividades escolares disfrutabas más?","en":"What subjects or school activities did you enjoy most?","c":"Escuela y adolescencia"},{"id":20,"es":"¿Qué recuerdas del recreo, la hora de la comida o tus rutinas después de la escuela?","en":"What do you remember about recess, lunch time, or your after-school routines?","c":"Escuela y adolescencia"},{"id":21,"es":"¿Hubo un momento en la escuela que te hizo sentir especialmente orgulloso(a)?","en":"Was there a moment at school that made you feel especially proud?","c":"Escuela y adolescencia"},{"id":22,"es":"¿Cómo fue tu experiencia en la secundaria o preparatoria?","en":"What was your experience in middle school or high school like?","c":"Escuela y adolescencia"},{"id":23,"es":"¿Qué recuerdas del día de tu graduación de la preparatoria?","en":"What do you remember about your high school graduation day?","c":"Escuela y adolescencia"},{"id":24,"es":"¿Alguna vez tuviste problemas en la escuela? ¿Qué pasó y cómo lo resolviste?","en":"Did you ever have problems at school? What happened and how did you resolve it?","c":"Escuela y adolescencia"},{"id":25,"es":"¿Puedes contarme la historia de tu primer amor o enamoramiento?","en":"Can you tell me the story of your first love or crush?","c":"Amor y relaciones"},{"id":26,"es":"¿Cómo conociste a tu pareja o cónyuge?","en":"How did you meet your partner or spouse?","c":"Amor y relaciones"},{"id":27,"es":"¿Qué recuerdas con más cariño del día de tu boda o de cuando comenzaron su vida juntos?","en":"What do you remember most fondly about your wedding day or when you started your life together?","c":"Amor y relaciones"},{"id":28,"es":"¿Cuál ha sido el mayor reto y la mayor alegría en tu relación de pareja?","en":"What has been the biggest challenge and the greatest joy in your relationship?","c":"Amor y relaciones"},{"id":29,"es":"¿Qué consejo darías sobre el amor, el perdón o una relación duradera?","en":"What advice would you give about love, forgiveness, or a lasting relationship?","c":"Amor y relaciones"},{"id":30,"es":"¿Cómo te sentiste al convertirte en madre o padre por primera vez?","en":"How did you feel when you became a mother or father for the first time?","c":"Hijos y familia propia"},{"id":31,"es":"¿Cómo se llaman tus hijos y cómo eligieron sus nombres?","en":"What are your children's names and how did you choose them?","c":"Hijos y familia propia"},{"id":32,"es":"¿Cuáles han sido algunos de tus momentos favoritos al criar a tus hijos?","en":"What have been some of your favorite moments raising your children?","c":"Hijos y familia propia"},{"id":33,"es":"¿Cómo les enseñabas valores o principios importantes en casa?","en":"How did you teach important values or principles at home?","c":"Hijos y familia propia"},{"id":34,"es":"¿Qué tradiciones familiares crearon o continuaron en tu hogar?","en":"What family traditions did you create or continue in your home?","c":"Hijos y familia propia"},{"id":35,"es":"¿Qué esperabas transmitirles a tus hijos para su vida adulta?","en":"What did you hope to pass on to your children for their adult lives?","c":"Hijos y familia propia"},{"id":36,"es":"¿Cuál fue tu primer trabajo y cómo lo conseguiste?","en":"What was your first job and how did you get it?","c":"Trabajo y propósito"},{"id":37,"es":"¿Qué trabajo o profesión te hizo sentir más útil o realizado(a)?","en":"What job or profession made you feel most useful or fulfilled?","c":"Trabajo y propósito"},{"id":38,"es":"¿Cuál fue el trabajo más difícil que tuviste y qué aprendiste de él?","en":"What was the hardest job you had and what did you learn from it?","c":"Trabajo y propósito"},{"id":39,"es":"¿Cómo afectó tu vida laboral a tu familia, o cómo influyó tu familia en tu trabajo?","en":"How did your work life affect your family, or how did your family influence your work?","c":"Trabajo y propósito"},{"id":40,"es":"¿Qué aprendiste en tu familia sobre la fe, Dios o la espiritualidad?","en":"What did you learn in your family about faith, God, or spirituality?","c":"Espiritualidad y creencias"},{"id":41,"es":"¿Formaste parte de alguna comunidad religiosa? ¿Qué significó para ti?","en":"Were you part of any religious community? What did it mean to you?","c":"Espiritualidad y creencias"},{"id":42,"es":"¿Has vivido alguna experiencia espiritual que haya marcado tu vida?","en":"Have you had any spiritual experience that marked your life?","c":"Espiritualidad y creencias"},{"id":43,"es":"¿Cómo han cambiado tus creencias o tu forma de ver la vida con el tiempo?","en":"How have your beliefs or your way of seeing life changed over time?","c":"Espiritualidad y creencias"},{"id":44,"es":"¿Cómo expresabas gratitud, especialmente en los momentos difíciles?","en":"How did you express gratitude, especially in difficult times?","c":"Espiritualidad y creencias"},{"id":45,"es":"¿Cuál consideras que ha sido tu mayor logro en la vida?","en":"What do you consider to have been your greatest achievement in life?","c":"Reflexiones y legado"},{"id":46,"es":"¿Qué valores esperas que tus nietos o futuras generaciones conserven?","en":"What values do you hope your grandchildren or future generations will preserve?","c":"Reflexiones y legado"},{"id":47,"es":"¿Cómo describirías una vida bien vivida?","en":"How would you describe a life well lived?","c":"Reflexiones y legado"},{"id":48,"es":"Si pudieras dejar un mensaje o una historia para tu familia, ¿cuál sería?","en":"If you could leave a message or a story for your family, what would it be?","c":"Reflexiones y legado"}],CATS=[{"n":"Orígenes y familia","e":"Origins and family","ic":"🏡"},{"n":"Infancia y hogar","e":"Childhood and home","ic":"👶"},{"n":"Escuela y adolescencia","e":"School and adolescence","ic":"🏫"},{"n":"Amor y relaciones","e":"Love and relationships","ic":"❤️"},{"n":"Hijos y familia propia","e":"Children and my own family","ic":"👨‍👧‍👦"},{"n":"Trabajo y propósito","e":"Work and purpose","ic":"💼"},{"n":"Espiritualidad y creencias","e":"Faith and beliefs","ic":"🌱"},{"n":"Reflexiones y legado","e":"Reflections and legacy","ic":"🌟"}];</script>
<script>

const S={es:{title:'Mi Historia, Mi Legado',tag:'Las historias de tu vida, guardadas para quienes vienen después.',nw:'Comenzar mi libro',ct:'Continuar mi libro',name:'Nombre completo de quien cuenta su historia',pin:'Crea un PIN (mínimo 4 dígitos)',inv:'Código de acceso, si lo recibiste',code:'Código de tu libro',pin2:'Tu PIN',go:'Entrar',badc:'Ese código de acceso no es válido.',err:'No se pudo completar. Revisa los datos e inténtalo otra vez.',ok:'Guardado',w:'Escribe aquí lo que recuerdes…',rec:'Grabar mi voz',stop:'Detener',ph:'Añadir una foto',prev:'Anterior',next:'Siguiente',map:'Capítulos',rv:'Mi libro',of:'de',cd:'El código de tu libro',cdn:'Anótalo: con él y tu PIN puedes volver a tu libro desde cualquier teléfono.',cdb:'Empezar',bk:'Tu libro',mk:'Crear mi libro en PDF',mkn:'Se abrirá la impresión del navegador: elige «Guardar como PDF». Las fotos van dentro del libro; los audios no.',dla:'Descargar mis audios',sv:'Ya guardé mi PDF',er:'Borrar mi historia de la nube',ern:'Tus respuestas, fotos y audios se eliminan para siempre de nuestros servidores.',cf:'¿Borrar todo para siempre? No se puede deshacer.',gone:'Tu historia fue borrada de la nube.',gn:'Guarda tu PDF en un lugar seguro y compártelo con tu familia.',home:'Inicio',mic:'Permite el micrófono para poder grabar.'},
en:{title:'My Story, My Legacy',tag:'The stories of your life, kept for those who come after.',nw:'Start my book',ct:'Continue my book',name:'Full name of the person telling the story',pin:'Create a PIN (4+ digits)',inv:'Access code, if you received one',code:'Your book code',pin2:'Your PIN',go:'Enter',badc:'That access code is not valid.',err:'Could not complete. Check your details and try again.',ok:'Saved',w:'Write what you remember here…',rec:'Record my voice',stop:'Stop',ph:'Add a photo',prev:'Previous',next:'Next',map:'Chapters',rv:'My book',of:'of',cd:'Your book code',cdn:'Write it down: with your PIN you can return to your book from any phone.',cdb:'Begin',bk:'Your book',mk:'Create my PDF book',mkn:'Your browser print window opens: choose “Save as PDF”. Photos are inside the book; audio is not.',dla:'Download my audio',sv:'I saved my PDF',er:'Erase my story from the cloud',ern:'Your answers, photos and audio are permanently deleted from our servers.',cf:'Erase everything forever? This cannot be undone.',gone:'Your story was erased from the cloud.',gn:'Keep your PDF somewhere safe and share it with your family.',home:'Home',mic:'Allow the microphone to record.'}};
let L=localStorage.L||((navigator.language||'es').startsWith('en')?'en':'es'),B=JSON.parse(localStorage.B||'null'),D,qi=0,rec,cur,tm,dt;
const t=k=>S[L][k],nm=c=>L=='es'?c.n:c.e,Lb=()=>L=='es'?'English':'Español';

async function api(a,o={},raw){const f=new FormData();if(B)f.append('id',B.id);for(const k in o)f.append(k,o[k]);const r=await fetch('api.php?a='+a,{method:'POST',body:f,headers:B?{'X-T':B.t}:{}});if(raw)return r.ok?r.blob():null;const j=await r.json().catch(()=>({e:1,m:'nophp'}));if(j.e)throw {...j,s:r.status};return j}
function setLang(){L=L=='es'?'en':'es';localStorage.L=L;document.documentElement.lang=L;cur()}

function home(){cur=home;A.innerHTML=`<div class="top"><span></span><button class="ln" onclick="setLang()">${Lb()}</button></div><section class="hero"><h1>${t('title')}</h1><p id="cy"></p><p class="tg">${t('tag')}</p><div class="row"><button class="btn" onclick="frm('n')">${t('nw')}</button><button class="btn g" onclick="cont()">${t('ct')}</button></div></section><div id="fm"></div>`;cyc()}

async function tgl(){if(rec){rec.r.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),m=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/mp4',r=new MediaRecorder(s,{mimeType:m,audioBitsPerSecond:32000}),ch=[],q=Q[qi].id,b=$('#mic'),t0=Date.now(),lb=b.textContent;r.ondataavailable=e=>ch.push(e.data);r.onstop=async()=>{s.getTracks().forEach(x=>x.stop());clearInterval(rec.i);rec=null;b.className='btn g';b.textContent='…';try{await api('up',{q,k:'u',f:new Blob(ch,{type:m.split(';')[0]}),ext:m.includes('webm')?'webm':'m4a'});D.u[q]=1}catch(e){}b.textContent=lb;if(Q[qi].id==q)shMedia(q)};r.start();b.className='btn on';rec={r,i:setInterval(()=>b.textContent='■ '+t('stop')+' '+Math.floor((Date.now()-t0)/1000)+'s',400)}}catch(e){alert(t('mic'))}}
function mp(){sv();cur=mp;A.innerHTML=`<div class="top"><button class="ln" onclick="ask()">←</button><button class="ln" onclick="setLang()">${Lb()}</button></div><h2>${t('map')}</h2><nav class="toc">`+CATS.map((c,i)=>{const n=Q.filter(q=>q.c==c.n),d=n.filter(q=>D.a[q.id]).length;return`<button onclick="jump(${i})"><span>${nm(c)}</span><span class="d"></span><small>${d}/${n.length}</small></button>`}).join('')+`</nav>`}

function rev(){sv();cur=rev;const n=Q.filter(q=>D.a[q.id]).length,au=Object.keys(D.u).filter(k=>D.u[k]).length;A.innerHTML=`<div class="top"><button class="ln" onclick="ask()">←</button><button class="ln" onclick="setLang()">${Lb()}</button></div><main class="pg"><h2>${t('bk')}</h2><p>${n} ${t('of')} ${Q.length}</p><button class="btn" onclick="mk()">${t('mk')}</button><small>${t('mkn')}</small>${au?`<button class="btn g" onclick="dl()">${t('dla')} (${au})</button>`:''}<hr><label><input type="checkbox" onchange="$('#ek').disabled=!this.checked">${t('sv')}</label><button class="btn d" id="ek" disabled onclick="wipe()">${t('er')}</button><small>${t('ern')}</small></main>`}
async function dl(){for(const k in D.u){if(!D.u[k])continue;const b=await api('file',{q:k,k:'u'},1);if(!b)continue;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='audio-'+k+(b.type.includes('webm')?'.webm':'.m4a');a.click();await new Promise(r=>setTimeout(r,400))}}
async function mk(){await sv();let h=`<div class="cv"><h1>${t('title')}</h1><h2>${esc(D.name)}</h2><p>${new Date().toLocaleDateString(L,{year:'numeric',month:'long',day:'numeric'})}</p></div>`;for(const c of CATS){const qs=Q.filter(q=>q.c==c.n&&(D.a[q.id]||D.p[q.id]));if(!qs.length)continue;h+=`<h3>${nm(c)}</h3>`;for(const q of qs){let im='';if(D.p[q.id]){const b=await api('file',{q:q.id,k:'p'},1);if(b)im=`<img src="${URL.createObjectURL(b)}" alt="">`}h+=`<div class="qa"><h4>${q[L]}</h4><p>${esc(D.a[q.id]||'').replace(/\n/g,'<br>')}</p>${im}</div>`}}$('#bk').innerHTML=h;await Promise.all([...$('#bk').querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));print()}
